name: Daily Refresh

on:
  workflow_dispatch: {}
  # Targets ~6:10 AM America/New_York, weekdays only. GitHub cron is UTC-only
  # with no timezone/DST awareness, and US DST transition dates (2nd Sunday
  # of March / 1st Sunday of November) shift by about a week every year - a
  # cron split on fixed months/days would silently drift wrong near those
  # transitions without yearly maintenance. Instead: fire at BOTH possible
  # UTC offsets every weekday (10:10 UTC covers EDT/UTC-4, 11:10 covers
  # EST/UTC-5). Moved 2 hours earlier than the previous 8:10 AM ET target
  # purely to buy more slack against GitHub's scheduled triggers being
  # best-effort and often firing 30-60+ min late - see the guard step below
  # for why that slack matters (a run delayed past ~8 PM America/New_York
  # crosses into "tomorrow" by the guard's UTC-day check). The guard no
  # longer restricts execution to a specific local-time window; the sole
  # gate for scheduled runs is "has origin/state already been updated today
  # (UTC)" - see the guard step's own comment for exactly how.
  schedule:
    - cron: '10 10 * * 1-5'
    - cron: '10 11 * * 1-5'

permissions:
  contents: write # needed for the state-branch push in "Publish state"
  pages: write # needed to publish the report to GitHub Pages
  id-token: write # needed by actions/deploy-pages to authenticate the deploy

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # First and cheapest step, before checkout, so a skip costs only a
      # few seconds. Two layers, checked in order:
      # 1. Manual (workflow_dispatch) runs bypass everything below and
      #    always proceed - a human clicking "Run workflow" wants it to run
      #    right now, not be silently skipped for any reason.
      # 2. Scheduled runs proceed unless origin/state was already updated
      #    "today" - checked entirely in UTC (both `date -u` below and
      #    GitHub API's commit.committer.date are UTC, never America/
      #    New_York). This is what prevents a double run: both cron offsets
      #    (10:10 and 11:10 UTC) land inside the same UTC calendar day on a
      #    normal weekday, so the FIRST firing to reach this check each day
      #    sees no commit dated today (UTC) and proceeds; by the time it
      #    finishes, "Publish state" has pushed a same-UTC-day commit, so
      #    the other offset (or a retry, or a late redelivery) sees that
      #    commit and skips - as long as the whole run finishes before UTC
      #    midnight.
      #
      #    Caveat: because the check is UTC-day based while the cron targets
      #    are Eastern-morning, a SEVERELY delayed run that doesn't actually
      #    execute until after ~8 PM EDT / 7 PM EST (i.e. past UTC midnight,
      #    already "tomorrow" in UTC) pushes its state commit dated with
      #    tomorrow's UTC date. That consumes tomorrow's dedup slot before
      #    tomorrow's real cron fires, so tomorrow's scheduled run is then
      #    skipped, not doubled - a day gets silently dropped rather than
      #    refreshed twice. Moving the cron 2 hours earlier (see `on:`
      #    above) lengthens GitHub's typical 30-60+ minute delay budget
      #    before this can happen; it doesn't eliminate the possibility.
      - name: Guard - once per day (UTC), skip if origin/state already refreshed today
        id: time_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - bypassing the guard entirely."
            exit 0
          fi

          today_utc=$(date -u +%Y-%m-%d)
          last_state_commit=$(gh api "repos/${{ github.repository }}/commits/state" --jq '.commit.committer.date')
          last_state_date=${last_state_commit:0:10}
          echo "Today (UTC): $today_utc | Latest origin/state commit date (UTC): $last_state_date"
          if [ "$last_state_date" = "$today_utc" ]; then
            # Tripwire, not an expected path: matching UTC dates should always
            # mean origin/state was updated well under 24h ago, given this
            # guard's own logic - so age here should never approach 48h. If it
            # somehow does (clock skew, an unusual manual commit to the state
            # branch, a future bug in this comparison), that means the "same
            # date = fresh" assumption this skip relies on is wrong, so fail
            # loudly instead of quietly skipping - a real gap should show red,
            # not a green run that silently did nothing.
            now_epoch=$(date -u +%s)
            last_epoch=$(date -u -d "$last_state_commit" +%s)
            age_hours=$(( (now_epoch - last_epoch) / 3600 ))
            echo "origin/state last commit age: ${age_hours}h"
            if [ "$age_hours" -gt 48 ]; then
              echo "::error::Guard tripwire - about to skip as a same-day dedup, but origin/state's newest commit is ${age_hours}h old (>48h). That shouldn't be possible if it's genuinely dated today (UTC) - failing loudly instead of silently skipping, since a weekday refresh may actually have been missed."
              exit 1
            fi
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "origin/state was already updated today (UTC) - a run already completed. Skipping to avoid a duplicate refresh."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "origin/state not yet updated today (UTC) - proceeding."
          fi

      - name: Checkout main
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          # LTS, not local's v25 (a non-LTS "Current" release with a short
          # support window). App has zero dependencies and no version-
          # specific syntax, so nothing is gained by chasing the newest major
          # - 22 is guaranteed available and stable for unattended CI.
          node-version: '22'

      - name: Hydrate state from origin/state
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin state --depth=1
          git checkout origin/state -- .
          echo "Hydrated from origin/state:"
          ls -la cache/ companies.json history/ research/ research-queue.json watchlist.json

      - name: Fetch data
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          node fetchData.js 2>&1 | tee fetchdata.log

      - name: Score + build report
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node screener.js 2>&1 | tee screener.log

      - name: Upload report + logs (always, even on failure)
        if: always() && (github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: screener-run-${{ github.run_id }}
          path: |
            screener-report.html
            fetchdata.log
            screener.log
          if-no-files-found: warn
          retention-days: 14

      # Publishes ONLY screener-report.html (renamed index.html) to GitHub
      # Pages. A fresh, otherwise-empty directory is the entire scoping
      # mechanism: upload-pages-artifact only ever sees whatever is inside
      # the directory its `path:` points at, so nothing else in this
      # workspace - source, cache/, companies.json, secrets - can leak onto
      # the public site no matter what else exists in the checkout.
      # Deliberately placed here (right after the report is built), NOT
      # after "Publish state" below - gated only on the report itself having
      # built successfully, so a later, unrelated state-branch publish
      # problem can never block an already-good report from going live.
      - name: Prepare Pages publish directory
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          rm -rf pages-publish
          mkdir -p pages-publish
          cp screener-report.html pages-publish/index.html
          ls -la pages-publish/

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-publish

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/deploy-pages@v4

      # Defense-in-depth: catches a silently-incomplete hydration or a
      # fetch/score step that exited 0 but wrote something truncated, before
      # the destructive `rsync --delete` below can propagate that damage to
      # origin/state. Only reached if fetch+score both already succeeded
      # (default GH Actions fail-fast - no continue-on-error / if: always()
      # on this step or the ones before it).
      - name: Hydration/output integrity guard
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          MIN_BYTES=50000
          check() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "::error::Guard failed - missing file: $f"
              exit 1
            fi
            local size
            size=$(wc -c < "$f")
            if [ "$size" -lt "$MIN_BYTES" ]; then
              echo "::error::Guard failed - $f is only $size bytes (< $MIN_BYTES)"
              exit 1
            fi
            echo "OK: $f ($size bytes)"
          }
          check companies.json
          check cache/fundamentals.json
          check cache/quote.json
          check cache/analyst.json
          check cache/news.json
          check cache/sec-cik-map.json
          echo "Guard passed - safe to publish to origin/state."

      # Separate worktree directory, not a branch switch in this workspace -
      # `git worktree add` checks state out into a brand-new empty
      # directory, so there is nothing there for git to delete and main's
      # checkout here is never touched. Only reached on full success; only
      # commits+pushes if there's an actual diff.
      - name: Publish state
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git worktree add ../state-worktree origin/state
          rsync -a --delete cache/ ../state-worktree/cache/
          rsync -a --delete history/ ../state-worktree/history/
          rsync -a --delete research/ ../state-worktree/research/
          cp companies.json research-queue.json watchlist.json ../state-worktree/
          cd ../state-worktree
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes to publish."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Daily refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/state
          fi
