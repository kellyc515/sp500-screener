name: Daily Refresh

on:
  workflow_dispatch: {}
  # Targets ~8:10 AM America/New_York, weekdays only. GitHub cron is UTC-only
  # with no timezone/DST awareness, and US DST transition dates (2nd Sunday
  # of March / 1st Sunday of November) shift by about a week every year - a
  # cron split on fixed months/days would silently drift wrong near those
  # transitions without yearly maintenance. Instead: fire at BOTH possible
  # UTC offsets every weekday (12:10 UTC covers EDT/UTC-4, 13:10 covers
  # EST/UTC-5), and the "Guard" step below checks the real, live
  # America/New_York clock and only lets the job proceed if it's actually
  # within the intended window - permanently correct, no maintenance, and
  # exactly one of these two firings ever does real work on any given day.
  schedule:
    - cron: '10 12 * * 1-5'
    - cron: '10 13 * * 1-5'

permissions:
  contents: write # needed for the state-branch push in "Publish state"
  pages: write # needed to publish the report to GitHub Pages
  id-token: write # needed by actions/deploy-pages to authenticate the deploy

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # First and cheapest step, before checkout, so the "wrong offset" cron
      # firing costs only a few seconds. Manual (workflow_dispatch) runs
      # always bypass this - a human clicking "Run workflow" wants it to run
      # right now, not be silently skipped for being outside the 8am window.
      - name: Guard - only proceed at the intended local time
        id: time_guard
        run: |
          set -euo pipefail
          local_time=$(TZ="America/New_York" date +%H%M)
          echo "Current America/New_York local time: $local_time"
          if [ "$local_time" -ge "0800" ] && [ "$local_time" -le "0820" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Outside the intended ~8:00-8:20 America/New_York window - this is the other UTC offset's cron firing (DST). Skipping without error."
          fi

      - name: Checkout main
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          # LTS, not local's v25 (a non-LTS "Current" release with a short
          # support window). App has zero dependencies and no version-
          # specific syntax, so nothing is gained by chasing the newest major
          # - 22 is guaranteed available and stable for unattended CI.
          node-version: '22'

      - name: Hydrate state from origin/state
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin state --depth=1
          git checkout origin/state -- .
          echo "Hydrated from origin/state:"
          ls -la cache/ companies.json history/ research/ research-queue.json watchlist.json

      - name: Fetch data
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          node fetchData.js 2>&1 | tee fetchdata.log

      - name: Score + build report
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node screener.js 2>&1 | tee screener.log

      - name: Upload report + logs (always, even on failure)
        if: always() && (github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: screener-run-${{ github.run_id }}
          path: |
            screener-report.html
            fetchdata.log
            screener.log
          if-no-files-found: warn
          retention-days: 14

      # Publishes ONLY screener-report.html (renamed index.html) to GitHub
      # Pages. A fresh, otherwise-empty directory is the entire scoping
      # mechanism: upload-pages-artifact only ever sees whatever is inside
      # the directory its `path:` points at, so nothing else in this
      # workspace - source, cache/, companies.json, secrets - can leak onto
      # the public site no matter what else exists in the checkout.
      # Deliberately placed here (right after the report is built), NOT
      # after "Publish state" below - gated only on the report itself having
      # built successfully, so a later, unrelated state-branch publish
      # problem can never block an already-good report from going live.
      - name: Prepare Pages publish directory
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          rm -rf pages-publish
          mkdir -p pages-publish
          cp screener-report.html pages-publish/index.html
          ls -la pages-publish/

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-publish

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        uses: actions/deploy-pages@v4

      # Defense-in-depth: catches a silently-incomplete hydration or a
      # fetch/score step that exited 0 but wrote something truncated, before
      # the destructive `rsync --delete` below can propagate that damage to
      # origin/state. Only reached if fetch+score both already succeeded
      # (default GH Actions fail-fast - no continue-on-error / if: always()
      # on this step or the ones before it).
      - name: Hydration/output integrity guard
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          MIN_BYTES=50000
          check() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "::error::Guard failed - missing file: $f"
              exit 1
            fi
            local size
            size=$(wc -c < "$f")
            if [ "$size" -lt "$MIN_BYTES" ]; then
              echo "::error::Guard failed - $f is only $size bytes (< $MIN_BYTES)"
              exit 1
            fi
            echo "OK: $f ($size bytes)"
          }
          check companies.json
          check cache/fundamentals.json
          check cache/quote.json
          check cache/analyst.json
          check cache/news.json
          check cache/sec-cik-map.json
          echo "Guard passed - safe to publish to origin/state."

      # Separate worktree directory, not a branch switch in this workspace -
      # `git worktree add` checks state out into a brand-new empty
      # directory, so there is nothing there for git to delete and main's
      # checkout here is never touched. Only reached on full success; only
      # commits+pushes if there's an actual diff.
      - name: Publish state
        if: github.event_name != 'schedule' || steps.time_guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git worktree add ../state-worktree origin/state
          rsync -a --delete cache/ ../state-worktree/cache/
          rsync -a --delete history/ ../state-worktree/history/
          rsync -a --delete research/ ../state-worktree/research/
          cp companies.json research-queue.json watchlist.json ../state-worktree/
          cd ../state-worktree
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes to publish."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Daily refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/state
          fi
